<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkedIn Post Visual Export</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #e6edf3;
      }

      .wrap {
        text-align: center;
        padding: 24px;
      }

      .frame {
        width: 1200px;
        max-width: calc(100vw - 32px);
        border: 1px solid #30363d;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }

      img {
        display: block;
        width: 100%;
        height: auto;
      }

      p {
        margin: 16px 0 0;
        color: #8b949e;
        font-size: 14px;
      }

      code {
        color: #4493f8;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="frame">
        <img src="linkedin-production-architecture.svg" alt="Production systems architecture diagram" width="1200" height="627" />
      </div>
      <p>
        Export for LinkedIn: open this file in Chrome, right-click the image → Save image as PNG, or use
        <code>Win + Shift + S</code> to capture at 1200×627.
      </p>
    </div>
  </body>
</html>
