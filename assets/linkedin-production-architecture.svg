<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-label="Production systems architecture diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4493f8"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4493f8"/>
    </marker>
  </defs>

  <rect width="1200" height="627" fill="url(#bg)"/>

  <!-- grid -->
  <g opacity="0.08" stroke="#4493f8" stroke-width="1">
    <path d="M0 125 H1200 M0 250 H1200 M0 375 H1200 M0 500 H1200"/>
    <path d="M150 0 V627 M300 0 V627 M450 0 V627 M600 0 V627 M750 0 V627 M900 0 V627 M1050 0 V627"/>
  </g>

  <!-- header -->
  <text x="600" y="58" text-anchor="middle" fill="#e6edf3" font-family="Segoe UI, system-ui, sans-serif" font-size="28" font-weight="700">Production Systems: Trust by Design</text>
  <text x="600" y="88" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, system-ui, sans-serif" font-size="15">Backend reliability and applied AI on shared production foundations</text>
  <rect x="420" y="102" width="360" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- left panel: fintech backend -->
  <g filter="url(#shadow)">
    <rect x="48" y="130" width="520" height="390" rx="18" fill="url(#panel)" stroke="#30363d" stroke-width="1.5"/>
  </g>
  <rect x="48" y="130" width="520" height="42" rx="18" fill="#1f2937"/>
  <rect x="48" y="154" width="520" height="18" fill="#1f2937"/>
  <text x="72" y="158" fill="#4493f8" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">FINTECH BACKEND PLATFORM</text>

  <!-- backend boxes -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="78" y="188" width="130" height="52" rx="10" fill="#21262d" stroke="#30363d"/>
    <text x="143" y="212" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Client Apps</text>
    <text x="143" y="228" text-anchor="middle" fill="#8b949e" font-size="11">Mobile · Web · Admin</text>

    <rect x="248" y="188" width="130" height="52" rx="10" fill="#21262d" stroke="#4493f8" stroke-width="1.5"/>
    <text x="313" y="212" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">API Layer</text>
    <text x="313" y="228" text-anchor="middle" fill="#8b949e" font-size="11">REST · Validation</text>

    <rect x="418" y="188" width="130" height="52" rx="10" fill="#21262d" stroke="#30363d"/>
    <text x="483" y="212" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Core Services</text>
    <text x="483" y="228" text-anchor="middle" fill="#8b949e" font-size="11">Business Logic</text>

    <line x1="208" y1="214" x2="248" y2="214" stroke="#4493f8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="378" y1="214" x2="418" y2="214" stroke="#4493f8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="118" y="278" width="150" height="52" rx="10" fill="#21262d" stroke="#30363d"/>
    <text x="193" y="302" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Auth · RBAC</text>
    <text x="193" y="318" text-anchor="middle" fill="#8b949e" font-size="11">JWT · OAuth · MFA</text>

    <rect x="298" y="278" width="150" height="52" rx="10" fill="#21262d" stroke="#30363d"/>
    <text x="373" y="302" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">PostgreSQL</text>
    <text x="373" y="318" text-anchor="middle" fill="#8b949e" font-size="11">Transactions · Schema</text>

    <rect x="208" y="358" width="150" height="52" rx="10" fill="#21262d" stroke="#30363d"/>
    <text x="283" y="382" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Redis Cache</text>
    <text x="283" y="398" text-anchor="middle" fill="#8b949e" font-size="11">Latency · Throughput</text>

    <line x1="313" y1="240" x2="193" y2="278" stroke="#4493f8" stroke-width="1.5" opacity="0.75"/>
    <line x1="313" y1="240" x2="373" y2="278" stroke="#4493f8" stroke-width="1.5" opacity="0.75"/>
    <line x1="373" y1="330" x2="283" y2="358" stroke="#4493f8" stroke-width="1.5" opacity="0.75"/>

    <rect x="78" y="430" width="460" height="64" rx="12" fill="rgba(68,147,248,0.08)" stroke="#30363d"/>
    <text x="98" y="454" fill="#3fb950" font-size="12" font-weight="700">TRUST LAYER</text>
    <text x="98" y="476" fill="#c9d1d9" font-size="13">Integrations · Observability · CI/CD · 85% test coverage</text>
  </g>

  <!-- right panel: applied AI -->
  <g filter="url(#shadow)">
    <rect x="632" y="130" width="520" height="390" rx="18" fill="url(#panel)" stroke="#30363d" stroke-width="1.5"/>
  </g>
  <rect x="632" y="130" width="520" height="42" rx="18" fill="#1f2937"/>
  <rect x="632" y="154" width="520" height="18" fill="#1f2937"/>
  <text x="656" y="158" fill="#4493f8" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">APPLIED AI IN PRODUCTION</text>

  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="662" y="188" width="130" height="52" rx="10" fill="#21262d" stroke="#30363d"/>
    <text x="727" y="212" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">User Query</text>
    <text x="727" y="228" text-anchor="middle" fill="#8b949e" font-size="11">Apps · Internal Tools</text>

    <rect x="832" y="188" width="130" height="52" rx="10" fill="#21262d" stroke="#4493f8" stroke-width="1.5"/>
    <text x="897" y="212" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">RAG Pipeline</text>
    <text x="897" y="228" text-anchor="middle" fill="#8b949e" font-size="11">Retrieve · Rank</text>

    <rect x="1002" y="188" width="130" height="52" rx="10" fill="#21262d" stroke="#30363d"/>
    <text x="1067" y="212" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">LLM Service</text>
    <text x="1067" y="228" text-anchor="middle" fill="#8b949e" font-size="11">Grounded Output</text>

    <line x1="792" y1="214" x2="832" y2="214" stroke="#4493f8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="962" y1="214" x2="1002" y2="214" stroke="#4493f8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="742" y="278" width="150" height="52" rx="10" fill="#21262d" stroke="#30363d"/>
    <text x="817" y="302" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Vector DB</text>
    <text x="817" y="318" text-anchor="middle" fill="#8b949e" font-size="11">Embeddings · Qdrant</text>

    <rect x="922" y="278" width="150" height="52" rx="10" fill="#21262d" stroke="#30363d"/>
    <text x="997" y="302" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Guardrails</text>
    <text x="997" y="318" text-anchor="middle" fill="#8b949e" font-size="11">Scope · Safety</text>

    <rect x="832" y="358" width="150" height="52" rx="10" fill="#21262d" stroke="#30363d"/>
    <text x="907" y="382" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Evaluation</text>
    <text x="907" y="398" text-anchor="middle" fill="#8b949e" font-size="11">Quality · Monitoring</text>

    <line x1="897" y1="240" x2="817" y2="278" stroke="#4493f8" stroke-width="1.5" opacity="0.75"/>
    <line x1="897" y1="240" x2="997" y2="278" stroke="#4493f8" stroke-width="1.5" opacity="0.75"/>
    <line x1="997" y1="330" x2="907" y2="358" stroke="#4493f8" stroke-width="1.5" opacity="0.75"/>

    <rect x="662" y="430" width="460" height="64" rx="12" fill="rgba(68,147,248,0.08)" stroke="#30363d"/>
    <text x="682" y="454" fill="#3fb950" font-size="12" font-weight="700">PRODUCTION BAR</text>
    <text x="682" y="476" fill="#c9d1d9" font-size="13">Latency · Failure handling · Retrieval quality · FastAPI deployment</text>
  </g>

  <!-- center bridge -->
  <rect x="560" y="286" width="80" height="80" rx="40" fill="#161b22" stroke="#4493f8" stroke-width="2"/>
  <text x="600" y="318" text-anchor="middle" fill="#e6edf3" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">Shared</text>
  <text x="600" y="336" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Foundation</text>
  <line x1="568" y1="326" x2="632" y2="326" stroke="#4493f8" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.8"/>
  <line x1="520" y1="326" x2="568" y2="326" stroke="#4493f8" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.8"/>

  <!-- footer -->
  <rect x="180" y="548" width="840" height="48" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="600" y="578" text-anchor="middle" fill="#e6edf3" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600">Reliability is not a feature. It is the product.</text>
</svg>
